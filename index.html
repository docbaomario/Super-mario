<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xác nhận thông tin nhận quà</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            overflow: hidden;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 350px;
            width: 90%;
        }
        h2 {
            color: #333;
            margin-bottom: 10px;
        }
        p {
            color: #666;
            margin-bottom: 20px;
            font-size: 14px;
        }
        button {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover {
            background-color: #218838;
        }
        #scaryOverlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: black;
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }
        #scaryImg {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body>

    <div class="card" id="mainCard">
        <h2>🎁 Phần Quà May Mắn</h2>
        <p>Bạn đã nhận được một phần quà ngẫu nhiên từ hệ thống. Bấm vào nút bên dưới để mở quà nhé!</p>
        <button onclick="startTroll()">MỞ QUÀ NGAY</button>
    </div>

    <div id="scaryOverlay">
        <img id="scaryImg" src="anh-ma-kinh-di.jpg" alt="BOO!">
    </div>

    <!-- Âm thanh tiếng hét kinh dị online -->
    <audio id="screamSound" src="https://www.soundjay.com/human/sounds/screaming-woman-1.mp3" preload="auto"></audio>

    <script>
        function startTroll() {
            // Mở toàn màn hình
            let elem = document.documentElement;
            if (elem.requestFullscreen) {
                elem.requestFullscreen().catch(() => {});
            } else if (elem.webkitRequestFullscreen) {
                elem.webkitRequestFullscreen().catch(() => {});
            }

            // Phát âm thanh tiếng hét ở mức âm lượng tối đa
            let audio = document.getElementById('screamSound');
            audio.volume = 1.0;
            audio.play().catch(e => console.log(e));

            // Hiển thị ảnh ma kín màn hình
            document.getElementById('scaryOverlay').style.display = 'flex';
            document.getElementById('mainCard').style.display = 'none';

            // Rung máy điện thoại (nếu thiết bị hỗ trợ)
            if ("vibrate" in navigator) {
                navigator.vibrate([500, 100, 500, 100, 500, 100, 1000]);
            }
        }
    </script>
</body>
</html>
